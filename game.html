<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw a Fish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="sync-badge" class="sync-badge local" title="공유 상태">로컬</div>

  <!-- 그리기 화면 -->
  <section id="draw-screen" class="screen active">
    <header class="draw-header">
      <h1 class="brand">Draw a Fish!</h1>
      <p class="tagline">오른쪽으로 향하게 그려 주세요</p>
      <p class="subtag">그린 물고기는 모두의 수족관에서 함께 헤엄칩니다</p>
    </header>

    <div class="meta-row">
      <label class="tool name-tool">
        <span>닉네임</span>
        <input type="text" id="artist-name" maxlength="12" placeholder="익명의 화가" autocomplete="nickname">
      </label>
    </div>

    <div class="canvas-wrap">
      <div class="facing-hint" aria-hidden="true">→</div>
      <canvas id="draw-canvas" width="800" height="500"></canvas>
    </div>

    <div class="toolbar">
      <label class="tool">
        <span>색</span>
        <input type="color" id="color-picker" value="#1a5f7a">
      </label>
      <label class="tool">
        <span>굵기</span>
        <input type="range" id="brush-size" min="2" max="28" value="8">
      </label>
      <button type="button" id="btn-eraser" class="btn ghost">지우개</button>
      <button type="button" id="btn-clear" class="btn ghost">전체 지우기</button>
      <button type="button" id="btn-done" class="btn primary">수족관에 넣기!</button>
    </div>

    <div class="draw-extra">
      <button type="button" id="btn-watch" class="btn ghost">수족관 구경하기</button>
      <button type="button" id="btn-share" class="btn ghost">링크 복사</button>
    </div>
  </section>

  <!-- 수족관 화면 -->
  <section id="aquarium-screen" class="screen">
    <header class="aqua-header">
      <h1 class="brand">Global Tank</h1>
      <p class="tagline" id="fish-count">모두가 그린 물고기가 헤엄치는 중…</p>
      <p class="room-label" id="room-label"></p>
    </header>

    <div class="tank-wrap">
      <canvas id="aquarium-canvas"></canvas>
      <div class="bubbles" aria-hidden="true"></div>
    </div>

    <div class="aqua-actions">
      <button type="button" id="btn-draw-again" class="btn primary">나도 그리기</button>
      <button type="button" id="btn-share-aqua" class="btn ghost">링크 복사</button>
    </div>
  </section>

  <!-- 방 코드는 URL ?room= 으로만 지원 (기본: global) -->
  <input type="hidden" id="room-input" value="global">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="game.js"></script>
</body>
</html>
